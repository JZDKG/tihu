<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鹈鹕骑自行车</title>
<meta name="description" content="用 SVG 绘制的动画：一只鹈鹕骑着自行车沿海边木栈道兜风。">
<style>
  :root {
    /* 界面 */
    --page: #bfe3f2;
    --panel: rgba(255, 255, 255, 0.8);
    --panel-line: rgba(24, 44, 66, 0.12);
    --ink: #1b2a3a;
    --ink-soft: #55667a;
    --btn: rgba(24, 44, 66, 0.07);
    --btn-hover: rgba(24, 44, 66, 0.14);
    --accent: #e5484d;
    --focus: #2f6fe4;

    /* 场景：白天 */
    --sky-0: #5cb5e6;
    --sky-1: #a9dbf2;
    --sky-2: #fdebd0;
    --sun-core: #fffbef;
    --sun-edge: #ffe39c;
    --sun-glow: #fff2c8;
    --cloud: #ffffff;
    --cloud-shade: #d9e9f4;
    --far-land: #94bfd3;
    --horizon: #dff2f8;
    --sea-0: #2c87be;
    --sea-1: #44a7d5;
    --sea-2: #80d4da;
    --wave: #ffffff;
    --glitter: #fffbe8;
    --foam: #ffffff;
    --wet-sand: #dcbd88;
    --sand-0: #eed5a4;
    --sand-1: #f5e0b5;
    --sand-fore-0: #f0d7a6;
    --sand-fore-1: #e6c690;
    --plank-a: #c89868;
    --plank-b: #bd8c5c;
    --plank-c: #d3a574;
    --seam: #87603c;
    --fascia: #996a41;
    --fascia-hi: #ba8658;
    --post: #7b5435;
    --post-cap: #8f6441;
    --rope: #e2d0ab;
    --lamp: #3d4a5a;
    --lamp-glass: #eef3f5;
    --grass-0: #93b957;
    --grass-1: #6d983e;
    --palm-leaf: #4e9a4b;
    --palm-leaf-2: #3c8141;
    --palm-trunk: #b98c5d;
    --palm-ring: #9a7049;
    --feather: #ffffff;
    --feather-mid: #f2f5f8;
    --feather-shade: #d5dee7;
    --feather-line: #c6d0da;
    --feather-far: #cfd8e0;
    --outline: #4b596c;
    --frame: #e5484d;
    --frame-hi: #ff9a96;
    --sun-y: 0px;
    --night: 0;
  }
  /* 场景：黄昏 */
  :root[data-theme="dusk"] {
    --page: #2b2b55;
    --panel: rgba(32, 30, 60, 0.8);
    --panel-line: rgba(255, 255, 255, 0.14);
    --ink: #f4effa;
    --ink-soft: #bcb4d2;
    --btn: rgba(255, 255, 255, 0.09);
    --btn-hover: rgba(255, 255, 255, 0.17);
    --focus: #8ab4ff;

    --sky-0: #1f2455;
    --sky-1: #6c4f8e;
    --sky-2: #ffab78;
    --sun-core: #fff0c6;
    --sun-edge: #ff984c;
    --sun-glow: #ffb074;
    --sun-y: 205px;
    --cloud: #ffc4ad;
    --cloud-shade: #9b7597;
    --far-land: #6a5a8b;
    --horizon: #ffc39a;
    --sea-0: #3a3f78;
    --sea-1: #57558f;
    --sea-2: #a47d98;
    --wave: #ffd9c2;
    --glitter: #ffcf88;
    --foam: #ffe6db;
    --wet-sand: #af8b7c;
    --sand-0: #c9a48a;
    --sand-1: #d5b194;
    --sand-fore-0: #d2ac8e;
    --sand-fore-1: #b69177;
    --plank-a: #9a6f58;
    --plank-b: #8c634f;
    --plank-c: #a67a61;
    --seam: #5a3c30;
    --fascia: #6b4839;
    --fascia-hi: #87604b;
    --post: #55382c;
    --post-cap: #644335;
    --rope: #c5a994;
    --lamp: #2a2f3f;
    --lamp-glass: #ffe49a;
    --grass-0: #7a8c58;
    --grass-1: #596e46;
    --palm-leaf: #3d6e4f;
    --palm-leaf-2: #2c563f;
    --palm-trunk: #8b6753;
    --palm-ring: #6b4c3f;
    --feather: #fff6ef;
    --feather-mid: #f6e5dc;
    --feather-shade: #cfb8c2;
    --feather-line: #d6bdc5;
    --feather-far: #d3bcc5;
    --outline: #403a56;
    --frame: #de4450;
    --frame-hi: #ff8e89;
    --night: 1;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* 鹈鹕白色部分：先描边再填充，内部接缝不可见 */
  .pel-outline .w, .pel-outline .o { fill: none; stroke: var(--outline); stroke-width: 3.4; stroke-linejoin: round; }
  .pel-fill .w, .pel-fill .f { fill: url(#g-feather); stroke: none; }

  .tube { fill: none; stroke: var(--frame); stroke-linecap: round; stroke-linejoin: round; }
  .tube-hi { fill: none; stroke: var(--frame-hi); stroke-linecap: round; opacity: .7; }
  .night-only { opacity: var(--night); }
  /* 切换昼夜时颜色平滑过渡 */
  #scene * { transition: fill 1.4s ease, stroke 1.4s ease, stop-color 1.4s ease; }
  #scene .night-only { transition: opacity 1.4s ease, fill 1.4s ease; }
  #scene #sun { transform: translateY(var(--sun-y)); transition: transform 1.8s ease-in-out; }
  .no-anim #scene *, .no-anim #scene #sun { transition: none !important; }
  .u-a { fill: var(--ua); } .u-b { fill: var(--ub); }

  #bell.ring { animation: bell-shake .6s ease-out; transform-box: fill-box; transform-origin: 50% 90%; }
  @keyframes bell-shake {
    0%, 100% { transform: rotate(0); }
    15% { transform: rotate(-22deg); } 30% { transform: rotate(18deg); }
    45% { transform: rotate(-14deg); } 60% { transform: rotate(10deg); } 80% { transform: rotate(-5deg); }
  }
  #bubble { opacity: 0; transform-box: fill-box; transform-origin: 12% 100%; transform: scale(.6); pointer-events: none; }
  #bubble.show { animation: bubble-pop 1.6s ease-out forwards; }
  @keyframes bubble-pop {
    0% { opacity: 0; transform: scale(.6); }
    12% { opacity: 1; transform: scale(1.06); }
    20% { transform: scale(1); }
    78% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(.96) translateY(-6px); }
  }

  /* 界面 */
  .hud {
    position: fixed; top: max(14px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left));
    padding: 10px 14px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--panel-line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 6px 24px rgba(22, 52, 80, .14);
    max-width: calc(100vw - 32px);
  }
  .hud h1 { margin: 0; font-size: 17px; line-height: 1.3; letter-spacing: .04em; }
  .hud p { margin: 2px 0 0; font-size: 12px; color: var(--ink-soft); }
  .controls {
    position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px; padding: 6px;
    border-radius: 999px; background: var(--panel); border: 1px solid var(--panel-line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 8px 28px rgba(22, 52, 80, .18);
    max-width: calc(100vw - 32px);
  }
  .controls button {
    display: inline-flex; align-items: center; gap: 6px; height: 40px; min-width: 40px; padding: 0 12px;
    justify-content: center; border: 0; border-radius: 999px; background: var(--btn); color: var(--ink);
    font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap;
    transition: background .15s;
  }
  .controls button:hover { background: var(--btn-hover); }
  .controls button:focus-visible, .controls input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .controls button svg { width: 18px; height: 18px; flex: none; }
  #btn-play { padding: 0; width: 40px; justify-content: center; background: var(--accent); color: #fff; }
  #btn-play:hover { filter: brightness(1.08); background: var(--accent); }
  .speed { display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
  .speed input { width: 110px; accent-color: var(--accent); }
  .speed output { min-width: 34px; font-variant-numeric: tabular-nums; color: var(--ink); }
  @media (max-width: 520px) {
    .controls button span, .speed > span { display: none; }
    .controls button { padding: 0 10px; }
    .speed input { width: 84px; }
    .hud p { display: none; }
  }
  @media (max-width: 420px) {
    .controls { gap: 5px; padding: 5px; }
    .controls button { height: 38px; min-width: 38px; padding: 0 9px; }
    #btn-play { width: 38px; }
    .speed { padding: 0 6px; }
    .speed input { width: 72px; }
    .speed output { display: none; }
  }
  @media (max-height: 480px) {
    .hud { padding: 6px 10px; top: max(8px, env(safe-area-inset-top)); }
    .hud h1 { font-size: 14px; }
    .hud p { display: none; }
    .controls { bottom: max(8px, env(safe-area-inset-bottom)); padding: 4px; }
    .controls button { height: 34px; min-width: 34px; }
    #btn-play { width: 34px; }
  }
  @media (hover: none) { .hud p .keys { display: none; } }
</style>
</head>
<body>

<svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 60 1200 600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="scene-title scene-desc">
  <title id="scene-title">鹈鹕骑自行车</title>
  <desc id="scene-desc">一只白色鹈鹕系着黄色围巾，骑着红色复古自行车沿海边木栈道前行，车筐里装着几条鱼。远处有大海、帆船、灯塔、棕榈树和海鸥。</desc>

  <defs>
    <!-- ========== 渐变 ========== -->
    <linearGradient id="g-sky" gradientUnits="userSpaceOnUse" x1="0" y1="-300" x2="0" y2="378">
      <stop offset="0" style="stop-color:var(--sky-0)"/>
      <stop offset=".62" style="stop-color:var(--sky-1)"/>
      <stop offset="1" style="stop-color:var(--sky-2)"/>
    </linearGradient>
    <radialGradient id="g-sun-glow" gradientUnits="userSpaceOnUse" cx="850" cy="118" r="200">
      <stop offset="0" style="stop-color:var(--sun-glow);stop-opacity:.95"/>
      <stop offset=".3" style="stop-color:var(--sun-glow);stop-opacity:.4"/>
      <stop offset="1" style="stop-color:var(--sun-glow);stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="g-sun" cx=".42" cy=".38" r=".62">
      <stop offset="0" style="stop-color:var(--sun-core)"/>
      <stop offset="1" style="stop-color:var(--sun-edge)"/>
    </radialGradient>
    <linearGradient id="g-sea" gradientUnits="userSpaceOnUse" x1="0" y1="376" x2="0" y2="458">
      <stop offset="0" style="stop-color:var(--sea-0)"/>
      <stop offset=".5" style="stop-color:var(--sea-1)"/>
      <stop offset="1" style="stop-color:var(--sea-2)"/>
    </linearGradient>
    <linearGradient id="g-beach" gradientUnits="userSpaceOnUse" x1="0" y1="452" x2="0" y2="520">
      <stop offset="0" style="stop-color:var(--wet-sand)"/>
      <stop offset=".2" style="stop-color:var(--sand-0)"/>
      <stop offset="1" style="stop-color:var(--sand-1)"/>
    </linearGradient>
    <linearGradient id="g-fore" gradientUnits="userSpaceOnUse" x1="0" y1="575" x2="0" y2="780">
      <stop offset="0" style="stop-color:var(--sand-fore-0)"/>
      <stop offset="1" style="stop-color:var(--sand-fore-1)"/>
    </linearGradient>
    <radialGradient id="g-shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3b2a18" stop-opacity=".34"/>
      <stop offset=".65" stop-color="#3b2a18" stop-opacity=".16"/>
      <stop offset="1" stop-color="#3b2a18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-beam" gradientUnits="userSpaceOnUse" x1="738" y1="0" x2="1010" y2="0">
      <stop offset="0" stop-color="#fff2c4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff2c4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="g-pool" r=".5">
      <stop offset="0" stop-color="#fff0c0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff0c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-red-glow" r=".5">
      <stop offset="0" stop-color="#ff5a5a" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ff3b3b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-lamp-glow" r=".5">
      <stop offset="0" stop-color="#ffe7a8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffcf70" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="g-feather" gradientUnits="userSpaceOnUse" x1="660" y1="130" x2="470" y2="335">
      <stop offset="0" style="stop-color:var(--feather)"/>
      <stop offset=".55" style="stop-color:var(--feather-mid)"/>
      <stop offset="1" style="stop-color:var(--feather-shade)"/>
    </linearGradient>
    <linearGradient id="g-thigh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--feather)"/>
      <stop offset="1" style="stop-color:var(--feather-shade)"/>
    </linearGradient>
    <linearGradient id="g-bill" gradientUnits="userSpaceOnUse" x1="636" y1="150" x2="760" y2="188">
      <stop offset="0" stop-color="#f39a55"/>
      <stop offset=".5" stop-color="#f8b54a"/>
      <stop offset="1" stop-color="#f4a236"/>
    </linearGradient>
    <linearGradient id="g-pouch" gradientUnits="userSpaceOnUse" x1="0" y1="176" x2="0" y2="218">
      <stop offset="0" stop-color="#f8b87a"/>
      <stop offset="1" stop-color="#ec8b58"/>
    </linearGradient>
    <linearGradient id="g-leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8ae55"/>
      <stop offset="1" stop-color="#e38535"/>
    </linearGradient>
    <linearGradient id="g-chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f7f9"/>
      <stop offset=".5" stop-color="#c3cad2"/>
      <stop offset="1" stop-color="#8d959f"/>
    </linearGradient>
    <linearGradient id="g-leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ad723e"/>
      <stop offset="1" stop-color="#6c4121"/>
    </linearGradient>
    <linearGradient id="g-basket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6b770"/>
      <stop offset="1" stop-color="#c38c45"/>
    </linearGradient>
    <linearGradient id="g-fish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f86ad"/>
      <stop offset=".55" stop-color="#9fbad3"/>
      <stop offset="1" stop-color="#e3edf5"/>
    </linearGradient>
    <radialGradient id="g-blur" r=".5">
      <stop offset=".12" stop-color="#a7afb9" stop-opacity="0"/>
      <stop offset=".85" stop-color="#a7afb9" stop-opacity=".6"/>
      <stop offset="1" stop-color="#a7afb9" stop-opacity=".25"/>
    </radialGradient>

    <!-- ========== 鹈鹕白色部件（描边/填充两遍复用） ========== -->
    <path id="pb-tail" d="M447 280C434 276 417 276 401 281C405 285 406 289 403 292C415 296 428 301 441 306Z"/>
    <path id="pb-body" d="M440 289C452 256 498 225 552 215C588 209 610 232 605 262C600 292 570 318 530 325C506 329 480 327 462 321C446 316 437 303 440 289Z"/>
    <path id="pb-neck" d="M556 228C553 206 562 184 590 167L615 181C605 196 598 212 600 230C601 240 604 248 606 257C590 259 570 250 556 228Z"/>
    <path id="pb-head" d="M582 168C580 146 598 131 618 131C634 131 644 141 645 153L644 170C634 179 621 182 609 179C594 176 583 179 582 168Z"/>
    <clipPath id="clip-body"><use href="#pb-body"/></clipPath>
    <path id="pouch-shape" d="M626 177C656 180 712 189 754 193C744 206 714 218 682 219C654 220 630 209 612 191C614 185 619 179 626 177Z"/>
    <clipPath id="clip-pouch"><use href="#pouch-shape"/></clipPath>

    <!-- 小鱼 -->
    <g id="fish">
      <path fill="url(#g-fish)" stroke="#44617f" stroke-width="1" d="M-12 0C-6 -7 6 -7 11 -1L17 -6L16 0L17 6L11 1C6 7 -6 7 -12 0Z"/>
      <circle cx="-7" cy="-1" r="1.3" fill="#1c2733"/>
      <path fill="none" stroke="#44617f" stroke-width=".8" d="M-3 -4Q-1 0 -3 4"/>
    </g>

    <!-- ========== 平铺图块 ========== -->
    <path id="cloud-shape" d="M-72 18C-96 18-98-8-76-12C-78-38-44-48-28-28C-18-56 26-60 38-32C54-46 84-36 80-10C102-8 104 18 80 18Z"/>
    <g id="cloud">
      <use href="#cloud-shape" style="fill:var(--cloud-shade)"/>
      <use href="#cloud-shape" style="fill:var(--cloud)" transform="translate(-2 -6) scale(.96)"/>
    </g>
    <g id="tile-clouds">
      <use href="#cloud" transform="translate(180 132) scale(1.05)"/>
      <use href="#cloud" transform="translate(760 96) scale(.62)"/>
      <use href="#cloud" transform="translate(1330 176) scale(1.3 1.1)"/>
      <use href="#cloud" transform="translate(1960 110) scale(.82)"/>
      <use href="#cloud" transform="translate(520 -40) scale(.9)"/>
      <use href="#cloud" transform="translate(1180 -150) scale(1.2)"/>
      <use href="#cloud" transform="translate(1720 -60) scale(.7)"/>
      <use href="#cloud" transform="translate(2250 -200) scale(1.05)"/>
      <use href="#cloud" transform="translate(80 -230) scale(.75)"/>
    </g>

    <g id="gull-a">
      <path fill="none" stroke="#3f4a57" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M-14 0Q-7 -7 0 0Q7 -7 14 0">
        <animate attributeName="d" dur=".9s" repeatCount="indefinite"
          values="M-14 0Q-7 -7 0 0Q7 -7 14 0;M-14 5Q-7 -2 0 0Q7 -2 14 5;M-13 -5Q-7 -9 0 0Q7 -9 13 -5;M-14 0Q-7 -7 0 0Q7 -7 14 0"/>
      </path>
    </g>
    <g id="gull-b">
      <path fill="none" stroke="#3f4a57" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M-14 0Q-7 -7 0 0Q7 -7 14 0">
        <animate attributeName="d" dur="1.05s" begin="-.4s" repeatCount="indefinite"
          values="M-14 0Q-7 -7 0 0Q7 -7 14 0;M-14 5Q-7 -2 0 0Q7 -2 14 5;M-13 -5Q-7 -9 0 0Q7 -9 13 -5;M-14 0Q-7 -7 0 0Q7 -7 14 0"/>
      </path>
    </g>
    <g id="tile-gulls">
      <use href="#gull-a" transform="translate(300 182)"/>
      <use href="#gull-b" transform="translate(352 150) scale(.8)"/>
      <use href="#gull-b" transform="translate(1700 232) scale(.7)"/>
      <use href="#gull-a" transform="translate(900 20) scale(.9)"/>
      <use href="#gull-b" transform="translate(2100 -90) scale(.8)"/>
    </g>

    <g id="tile-far">
      <path style="fill:var(--far-land)" d="M110 378C160 366 215 355 268 354C320 353 380 361 430 368C468 373 496 376 520 378Z"/>
      <g transform="translate(302 355)">
        <path fill="#f7f6f0" d="M-4.6 0L-3.4 -24H3.4L4.6 0Z"/>
        <path fill="#e25b4f" d="M-4.3 -6L-3.9 -11H3.9L4.3 -6ZM-3.7 -16L-3.5 -20H3.5L3.7 -16Z"/>
        <rect x="-4.2" y="-29" width="8.4" height="5" fill="#3a4250"/>
        <path fill="#e25b4f" d="M-5 -29L0 -34L5 -29Z"/>
        <circle cx="0" cy="-26.5" r="1.8" fill="#fff4b0"/>
        <circle cx="0" cy="-26.5" r="16" fill="url(#g-lamp-glow)" class="night-only"/>
      </g>
      <path style="fill:var(--far-land)" opacity=".75" d="M1700 378C1740 370 1790 366 1840 368C1880 370 1910 374 1932 378Z"/>
    </g>

    <g id="boat">
      <path fill="#f6f3ec" d="M1 -3L1 -31L17 -5Z"/>
      <path fill="#e8e2d6" d="M-1 -5L-1 -26L-12 -6Z"/>
      <path fill="none" stroke="#4b4f58" stroke-width="1.1" d="M0 -1V-33"/>
      <path fill="#33526d" d="M-17 -1H18L12 5H-12Z"/>
    </g>
    <g id="tile-boats">
      <g transform="translate(260 386)">
        <g><use href="#boat"/><animateTransform attributeName="transform" type="rotate" values="-2;2;-2" dur="3.4s" repeatCount="indefinite"/></g>
      </g>
      <g transform="translate(1180 381) scale(.68)">
        <g><use href="#boat"/><animateTransform attributeName="transform" type="rotate" values="2;-2;2" dur="4.1s" repeatCount="indefinite"/></g>
      </g>
    </g>

    <g id="tile-waves"></g>

    <g id="tile-foam">
      <g>

<script>
(() => {
  'use strict';

  const NS = 'http://www.w3.org/2000/svg';
  const D2R = Math.PI / 180, R2D = 180 / Math.PI;
  const $ = (id) => document.getElementById(id);
  const svg = $('scene');
  const fx = (n) => Math.round(n * 100) / 100;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const rot = (p, deg, c) => {
    const a = deg * D2R, cs = Math.cos(a), sn = Math.sin(a), x = p.x - c.x, y = p.y - c.y;
    return { x: c.x + x * cs - y * sn, y: c.y + x * sn + y * cs };
  };
  // 可复现的伪随机
  let seed = 20260924;
  const rand = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  /* ================= 自行车几何 ================= */
  const R = 84;                          // 车轮半径（到胎面）
  const REAR = { x: 420, y: 456 }, FRONT = { x: 686, y: 456 }, BB = { x: 530, y: 470 };
  const CRANK = 40;
  const RING = { r: 21, teeth: 28 }, COG = { r: 15, teeth: 20 };
  const RATIO = RING.teeth / COG.teeth;  // 齿比：曲柄转一圈，车轮转 1.4 圈
  const add = (p, v, k) => ({ x: p.x + v.x * k, y: p.y + v.y * k });
  const uSeat = { x: -Math.cos(72 * D2R), y: -Math.sin(72 * D2R) };
  const uHead = { x: -Math.cos(70 * D2R), y: -Math.sin(70 * D2R) };
  const nFwd = { x: -uHead.y, y: uHead.x };
  const ST = add(BB, uSeat, 120);
  const crown = add(add(FRONT, uHead, 90), nFwd, -11);
  const htBottom = add(crown, uHead, 3), htTop = add(crown, uHead, 42);
  const ttFront = add(crown, uHead, 35), dtFront = add(crown, uHead, 10);
  const ssTop = add(ST, uSeat, -5), postTop = add(ST, uSeat, 17);
  const steerTop = add(htTop, uHead, 12);
  const barClamp = { x: steerTop.x + 15, y: steerTop.y - 3 };
  const P = (p) => `${fx(p.x)} ${fx(p.y)}`;
  const line = (a, b) => `M${P(a)}L${P(b)}`;

  function buildBike() {
    const set = (id, d) => $(id).setAttribute('d', d);
    set('t-st', line(BB, add(ST, uSeat, 3)));
    set('t-tt', line(ST, ttFront));
    set('t-dt', line(BB, dtFront));
    set('t-ht', line(htBottom, htTop));
    set('t-ss', line(ssTop, REAR));
    set('t-cs', line(BB, REAR));
    const forkD = `M${P(crown)}Q${P(add(crown, uHead, -62))} ${P(FRONT)}`;
    set('t-fork', forkD);
    document.querySelector('.hi-dt').setAttribute('d', line(add(BB, { x: dtFront.x - BB.x, y: dtFront.y - BB.y }, 0.12), add(BB, { x: dtFront.x - BB.x, y: dtFront.y - BB.y }, 0.9)));
    document.querySelector('.hi-tt').setAttribute('d', line(add(ST, { x: ttFront.x - ST.x, y: ttFront.y - ST.y }, 0.08), add(ST, { x: ttFront.x - ST.x, y: ttFront.y - ST.y }, 0.9)));
    document.querySelector('.hi-st').setAttribute('d', line(add(BB, uSeat, 30), add(BB, uSeat, 112)));
    document.querySelector('.hi-fork').setAttribute('d', forkD);
    set('seatpost', line(ST, postTop));
    set('stem', `M${P(htTop)}L${P(steerTop)}L${P(barClamp)}`);
    const c = barClamp;
    set('handlebar', `M${P(c)}C${fx(c.x - 3)} ${fx(c.y - 10)} ${fx(c.x - 15)} ${fx(c.y - 11)} ${fx(c.x - 27)} ${fx(c.y - 8)}L${fx(c.x - 42)} ${fx(c.y - 4.2)}`);
    set('grip', `M${fx(c.x - 28)} ${fx(c.y - 7.7)}L${fx(c.x - 42)} ${fx(c.y - 4.2)}`);

    // 车标与车头徽章
    const mid = { x: (BB.x + dtFront.x) / 2, y: (BB.y + dtFront.y) / 2 };
    const ang = Math.atan2(dtFront.y - BB.y, dtFront.x - BB.x) * R2D;
    $('decal').setAttribute('transform', `translate(${P(mid)}) rotate(${fx(ang)})`);
    const bm = add(htBottom, uHead, 18);
    $('badge').setAttribute('cx', fx(bm.x)); $('badge').setAttribute('cy', fx(bm.y));

    // 挡泥板
    const arc = (c, r, a1, a2, sweep) => {
      const p1 = { x: c.x + r * Math.cos(a1 * D2R), y: c.y + r * Math.sin(a1 * D2R) };
      const p2 = { x: c.x + r * Math.cos(a2 * D2R), y: c.y + r * Math.sin(a2 * D2R) };
      return `M${P(p1)}A${r} ${r} 0 0 ${sweep} ${P(p2)}`;
    };
    set('fender-rear', arc(REAR, 91, -40, -185, 0));
    set('fender-front', arc(FRONT, 91, -150, -15, 1));
    set('fender-rear-hi', arc(REAR, 92.6, -48, -150, 0));
    set('fender-front-hi', arc(FRONT, 92.6, -140, -40, 1));
    const rr = { x: REAR.x + 92 * Math.cos(-176 * D2R), y: REAR.y + 92 * Math.sin(-176 * D2R) };
    $('rear-reflector').setAttribute('transform', `translate(${P(rr)}) rotate(-6)`);

    // 辐条（切向交叉编法）
    let sp = '';
    for (let i = 0; i < 24; i++) {
      const a = i * 15 * D2R, b = (i * 15 + (i % 2 ? -62 : 62)) * D2R;
      sp += `M${fx(8 * Math.cos(a))} ${fx(8 * Math.sin(a))}L${fx(70 * Math.cos(b))} ${fx(70 * Math.sin(b))}`;
    }
    document.querySelectorAll('.spokes').forEach((s) => s.setAttribute('d', sp));

    // 齿盘与飞轮
    const gear = (r, teeth, depth) => {
      const st = 2 * Math.PI / teeth, r0 = r - depth * 0.55, r1 = r + depth * 0.45;
      let d = '';
      for (let i = 0; i < teeth; i++) {
        const a = i * st;
        const pts = [[r0, a - 0.3 * st], [r1, a - 0.12 * st], [r1, a + 0.12 * st], [r0, a + 0.3 * st]];
        pts.forEach(([rr2, aa], j) => { d += (i === 0 && j === 0 ? 'M' : 'L') + fx(rr2 * Math.cos(aa)) + ' ' + fx(rr2 * Math.sin(aa)); });
      }
      return d + 'Z';
    };
    const ringHole = (r) => `M${r} 0A${r} ${r} 0 1 0 ${-r} 0A${r} ${r} 0 1 0 ${r} 0Z`;
    document.querySelector('#chainring .teeth').setAttribute('d', gear(RING.r, RING.teeth, 3.2) + ringHole(16.5));
    let spider = '';
    for (let i = 0; i < 5; i++) { const a = i * 72 * D2R; spider += `M0 0L${fx(17 * Math.cos(a))} ${fx(17 * Math.sin(a))}`; }
    document.querySelector('#chainring .spider').setAttribute('d', spider);
    document.querySelector('#cog .teeth').setAttribute('d', gear(COG.r, COG.teeth, 2.8));

    // 链条：两圆外公切线 + 圆弧
    const dx = BB.x - REAR.x, dy = BB.y - REAR.y, dist = Math.hypot(dx, dy);
    const base = Math.atan2(dy, dx), beta = Math.acos((COG.r - RING.r) / dist);
    const at = (c, r, a) => ({ x: c.x + r * Math.cos(a), y: c.y + r * Math.sin(a) });
    const t1 = at(BB, RING.r, base - beta), b1 = at(BB, RING.r, base + beta);
    const t2 = at(REAR, COG.r, base - beta), b2 = at(REAR, COG.r, base + beta);
    const chain = `M${P(t2)}L${P(t1)}A${RING.r} ${RING.r} 0 1 1 ${P(b1)}L${P(b2)}A${COG.r} ${COG.r} 0 0 1 ${P(t2)}Z`;
    $('chain-plates').setAttribute('d', chain);
    $('chain-rollers').setAttribute('d', chain);
    const runLen = Math.hypot(t1.x - t2.x, t1.y - t2.y);
    const ringArc = RING.r * (2 * beta), cogArc = COG.r * (2 * Math.PI - 2 * beta);
    chainLen = runLen * 2 + ringArc + cogArc;
  }
  let chainLen = 1;

  /* ================= 翅膀“蒙皮”：肩部随身体动，手固定在车把上 ================= */
  const wingWeight = (x, y) => clamp((y - 245) / 55, 0, 1);
  function makeSkin(d) {
    const tok = d.match(/[MLCQZ]|-?\d*\.?\d+/g), out = [];
    for (let i = 0; i < tok.length;) {
      if (/[MLCQZ]/.test(tok[i])) { out.push(tok[i]); i++; }
      else { const x = +tok[i], y = +tok[i + 1]; out.push([x, y, 1 - wingWeight(x, y)]); i += 2; }
    }
    return (dx, dy) => out.map((o) => (typeof o === 'string' ? o : `${fx(o[0] + o[2] * dx)} ${fx(o[1] + o[2] * dy)}`)).join(' ');
  }
  const skins = {
    'far-arm': makeSkin('M588 240C604 250 614 268 615 292C615 297 615 300 614 302L603 301C600 284 594 266 584 254Z'),
    'far-hand': makeSkin('M603 293C614 290 623 297 624 306C625 313 621 318 614 317C607 316 601 313 599 307C598 300 599 295 603 293Z'),
    'near-secondaries': makeSkin('M500 250C520 257 548 259 572 258C584 270 592 286 598 303L595 309Q590 305 588 300Q584 302 582 296Q578 296 577 290Q572 289 572 283Q566 281 567 275Q560 272 561 267Q550 270 546 264Q536 268 532 262Q522 265 518 260Q508 262 505 257Q498 257 500 250Z'),
    'near-wing': makeSkin('M498 238C520 222 552 216 574 225C598 236 609 262 610 290C610 295 610 299 609 302L596 302C592 287 584 272 570 262C548 262 520 260 502 254C494 250 493 242 498 238Z'),
    'near-wing-top': makeSkin('M503 254C494 250 493 242 498 238C520 222 552 216 574 225'),
    'near-wing-edge': makeSkin('M556 221C562 222 568 223 574 225C598 236 609 262 610 290C610 295 610 299 609 302M596 302C592 287 584 272 570 262C548 262 520 260 502 254'),
    'near-coverts': makeSkin('M516 240Q524 245 532 240Q540 245 548 240Q556 245 564 240M586 250Q592 257 598 254M592 268Q598 274 604 272'),
    'near-hand': makeSkin('M597 298C608 295 617 302 618 311C619 318 615 323 608 322C601 321 595 318 593 312C592 305 593 300 597 298Z'),
    'near-fingers': makeSkin('M600 304C607 303 612 307 613 313M597 310C603 310 607 313 608 318'),
  };
  const skinEls = Object.keys(skins).map((id) => [$(id), skins[id]]);

  /* ================= 腿：两段式反向运动学，脚始终踩在踏板上 ================= */
  const L1 = 90, L2 = 110;
  const HIP_NEAR = { x: 492, y: 318 }, HIP_FAR = { x: 498, y: 314 };
  function makeLeg(prefix) {
    const g = $(prefix + '-leg');
    return {
      thigh: g.querySelector('.thigh'), shin: g.querySelector('.shin'), foot: g.querySelector('.foot'),
      pedal: $(prefix + '-pedal'), crank: $(prefix + '-crank'),
    };
  }
  const legs = { near: makeLeg('near'), far: makeLeg('far') };
  function placeLeg(leg, hip, a) {
    const p = { x: BB.x + CRANK * Math.cos(a), y: BB.y + CRANK * Math.sin(a) };
    const fa = (14 + 10 * Math.sin(a)) * D2R;          // 脚踝角度：下踩时脚尖略压低
    const c = Math.cos(fa), s = Math.sin(fa);
    const tgt = { x: p.x - 3 * c + 6 * s, y: p.y - 3 * s - 6 * c };
    let dx = tgt.x - hip.x, dy = tgt.y - hip.y;
    const d0 = Math.hypot(dx, dy); dx /= d0; dy /= d0;
    const d = clamp(d0, Math.abs(L1 - L2) + 0.01, L1 + L2 - 0.01);
    const along = (L1 * L1 - L2 * L2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, L1 * L1 - along * along));
    const knee = { x: hip.x + dx * along + dy * h, y: hip.y + dy * along - dx * h };   // 膝盖朝前
    const foot = { x: hip.x + dx * d, y: hip.y + dy * d };
    const a1 = Math.atan2(knee.y - hip.y, knee.x - hip.x) * R2D;
    const a2 = Math.atan2(foot.y - knee.y, foot.x - knee.x) * R2D;
    leg.thigh.setAttribute('transform', `translate(${P(hip)}) rotate(${fx(a1)})`);
    leg.shin.setAttribute('transform', `translate(${P(knee)}) rotate(${fx(a2)})`);
    leg.foot.setAttribute('transform', `translate(${P(foot)}) rotate(${fx(fa * R2D)})`);
    leg.pedal.setAttribute('transform', `translate(${P(p)}) rotate(${fx(fa * R2D)})`);
    leg.crank.setAttribute('transform', `translate(${P(BB)}) rotate(${fx(a * R2D)})`);
  }

  /* ================= 围巾飘带 ================= */
  function ribbon(knot, len, width, angle, phase, t, sp) {
    const N = 16, amp = 1 + 4.2 * sp, speed = 4 + 8 * sp, pts = [];
    const bx = Math.cos(angle), by = Math.sin(angle);
    for (let i = 0; i <= N; i++) {
      const u = i / N, w = amp * u * Math.sin(u * 2.4 * Math.PI - t * speed + phase);
      pts.push({ x: knot.x + bx * len * u - by * w, y: knot.y + by * len * u + bx * w + (1 - sp) * 10 * u * u });
    }
    const L = [], Rr = [];
    for (let i = 0; i <= N; i++) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(N, i + 1)];
      let tx = b.x - a.x, ty = b.y - a.y; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      const hw = width * (1 - 0.3 * i / N) / 2;
      L.push(`${fx(pts[i].x - ty * hw)} ${fx(pts[i].y + tx * hw)}`);
      Rr.push(`${fx(pts[i].x + ty * hw)} ${fx(pts[i].y - tx * hw)}`);
    }
    const e = pts[N], e2 = pts[N - 1];
    const notch = `${fx(e.x - (e.x - e2.x) * 0.9)} ${fx(e.y - (e.y - e2.y) * 0.9)}`;
    return `M${L.join('L')}L${notch}L${Rr.reverse().join('L')}Z`;
  }

  /* ================= 平铺视差图层 ================= */
  const LAYERS = [
    { id: 'L-clouds', tile: 'tile-clouds', w: 2400, f: 0.03, drift: 5 },
    { id: 'L-gulls', tile: 'tile-gulls', w: 2600, f: 0.25, drift: -45 },
    { id: 'L-far', tile: 'tile-far', w: 3200, f: 0.012, drift: 0 },
    { id: 'L-waves', tile: 'tile-waves', w: 900, f: 0.15, drift: 2 },
    { id: 'L-boats', tile: 'tile-boats', w: 1800, f: 0.07, drift: 3 },
    { id: 'L-foam', tile: 'tile-foam', w: 420, f: 0.5, drift: 0 },
    { id: 'L-palms', tile: 'tile-palms', w: 2100, f: 0.52, drift: 0 },
    { id: 'L-beach', tile: 'tile-beach', w: 1600, f: 0.6, drift: 0 },
    { id: 'L-rail', tile: 'tile-rail', w: 1040, f: 0.867, drift: 0 },
    { id: 'L-fore', tile: 'tile-fore', w: 1400, f: 1.3, drift: 0 },
    { id: 'L-fore2', tile: 'tile-fore2', w: 1700, f: 1.75, drift: 0 },
  ];
  LAYERS.forEach((L) => { L.el = $(L.id); });

  function buildDecor() {
    // 海面波纹
    const waves = $('tile-waves');
    for (let i = 0; i < 46; i++) {
      const y = 380 + Math.pow(rand(), 1.3) * 68, k = (y - 376) / 80;
      const x = rand() * 900, len = 8 + k * 34 * (0.5 + rand());
      el('path', { d: `M${fx(x)} ${fx(y)}h${fx(len)}`, fill: 'none', style: 'stroke:var(--wave)', 'stroke-width': fx(0.8 + k * 1.6), 'stroke-linecap': 'round', opacity: fx(0.25 + rand() * 0.35) }, waves);
    }
    // 阳光在海面的闪烁
    const gl = $('glitter');
    for (let i = 0; i < 34; i++) {
      const y = 379 + i * 2.15, k = (y - 376) / 80;
      const w = 5 + k * 16 + rand() * 8;
      const x = 850 + (rand() - 0.5) * (18 + k * 110) - w / 2;
      const r = el('rect', { x: fx(x), y: fx(y), width: fx(w), height: fx(1 + k), rx: 0.6, style: 'fill:var(--glitter)', opacity: 0 }, gl);
      el('animate', { attributeName: 'opacity', values: '0;.95;0', dur: fx(1.2 + rand() * 1.4) + 's', begin: '-' + fx(rand() * 2) + 's', repeatCount: 'indefinite' }, r);
    }
    // 星星（黄昏模式）
    const stars = $('stars');
    for (let i = 0; i < 70; i++) {
      const cy = -520 + rand() * 700;
      const c = el('circle', { cx: fx(-900 + rand() * 3000), cy: fx(cy), r: fx(0.5 + rand() * 1.3), fill: '#fff', opacity: fx(clamp((200 - cy) / 260, 0.15, 1)) }, stars);
      if (i % 3 === 0) el('animate', { attributeName: 'opacity', values: '1;.25;1', dur: fx(2 + rand() * 3) + 's', begin: '-' + fx(rand() * 3) + 's', repeatCount: 'indefinite' }, c);
    }
  }

  /* ================= 视口：保证骑手始终完整可见，其余按比例铺满 ================= */
  const CX = 565, CY = 352, VPX = 565;
  const RIDER_TOP = 118, RIDER_BOTTOM = 548, SAFE_W = 520;
  let view = { x0: 0, x1: 1200 };
  function layout() {
    const w = window.innerWidth || 1200, h = window.innerHeight || 700;
    const topPx = 8, botPx = h < 480 ? 56 : 80;         // 底部留给控制栏
    const scale = Math.min(h / 600, (h - topPx - botPx) / (RIDER_BOTTOM - RIDER_TOP), w / SAFE_W);
    const vw = w / scale, vh = h / scale;
    const x0 = CX - vw / 2;
    const y0 = clamp(CY - vh / 2, RIDER_BOTTOM - (h - botPx) / scale, RIDER_TOP - topPx / scale);
    svg.setAttribute('viewBox', `${fx(x0)} ${fx(y0)} ${fx(vw)} ${fx(vh)}`);
    view = { x0, x1: x0 + vw };
    LAYERS.forEach((L) => {
      L.el.textContent = '';
      const k0 = Math.floor(view.x0 / L.w) - 1, k1 = Math.floor((view.x1 + L.w) / L.w) + 1;
      for (let k = k0; k <= k1; k++) el('use', { href: '#' + L.tile, x: k * L.w }, L.el);
    });
  }

  /* ================= 木栈道（带透视的木板缝） ================= */
  const PLANK_P = 300, PLANK_OFF = [0, 34, 74, 111, 155, 191, 233, 263], PLANK_TONE = [1, 0, 2, 0, 1, 2, 0, 1];
  function drawBoardwalk(s) {
    const fb = 0.867, ff = 1.073, yb = 518, yf = 552;
    const lo = s + VPX + (view.x0 - 40 - VPX) / fb, hi = s + VPX + (view.x1 + 40 - VPX) / fb;
    const k0 = Math.floor(lo / PLANK_P) - 1, k1 = Math.ceil(hi / PLANK_P) + 1;
    let seams = '', tb = '', tc = '', prev = null;
    for (let k = k0; k <= k1; k++) {
      for (let i = 0; i < 8; i++) {
        const xw = k * PLANK_P + PLANK_OFF[i] - s - VPX;
        const bx = fx(VPX + xw * fb), fxp = fx(VPX + xw * ff);
        seams += `M${bx} ${yb}L${fxp} ${yf}`;
        if (prev) {
          const tone = PLANK_TONE[(i + 7) % 8];
          const quad = `M${prev[0]} ${yb}L${bx} ${yb}L${fxp} ${yf}L${prev[1]} ${yf}Z`;
          if (tone === 1) tb += quad; else if (tone === 2) tc += quad;
        }
        prev = [bx, fxp];
      }
    }
    $('bw-seams').setAttribute('d', seams);
    $('bw-tone-b').setAttribute('d', tb);
    $('bw-tone-c').setAttribute('d', tc);
    // 立面接缝与螺栓
    let joints = '', bolts = '';
    const J = 180, jl = s * ff + (view.x0 - 20), j0 = Math.floor(jl / J) - 1, j1 = Math.ceil((s * ff + view.x1 + 20) / J) + 1;
    for (let k = j0; k <= j1; k++) {
      const x = fx(k * J - s * ff);
      joints += `M${x} 555V575`;
      bolts += `M${fx(x - 7)} 563.5a1.6 1.6 0 1 0 .01 0M${fx(x + 7)} 563.5a1.6 1.6 0 1 0 .01 0`;
    }
    $('bw-joints').setAttribute('d', joints);
    $('bw-bolts').setAttribute('d', bolts);
  }

  /* ================= 状态 ================= */
  const BASE_V = 480;
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const state = { s: 0, v: reduceMotion ? 0 : BASE_V, mult: 1, playing: !reduceMotion, t: 0 };
  const CRANK0 = 25 * D2R;
  const pouchSpring = { y: 0, v: 0 };
  let blinkAt = 1.8, blinkT = -1, glanceAt = 9, glanceT = -1;
  const feed = { active: false, t: 0 };

  const els = {
    rearSpin: document.querySelector('#wheel-rear .spin'), frontSpin: document.querySelector('#wheel-front .spin'),
    cogSpin: document.querySelector('#cog .spin'), ringSpin: document.querySelector('#chainring .spin'),
    blurs: document.querySelectorAll('.blur'), spokes: document.querySelectorAll('.spokes'),
    rollers: $('chain-rollers'), pelO: $('pel-outline'), pelF: $('pel-fill'),
    headRot: document.querySelectorAll('.head-rot'), tailRot: document.querySelectorAll('.tail-rot'),
    crest: $('crest'), eye: $('eye'), jaw: $('jaw'), pouch: $('pouch'), pouchFish: $('pouch-fish'),
    scarfA: $('scarf-a'), scarfB: $('scarf-b'), lumpO: $('lump-o'), lumpF: $('lump-f'),
    fish: $('flying-fish'), heart: $('heart'), gulp: $('gulp'), bubble: $('bubble'), bell: $('bell'),
  };

  const NECK_PIVOT = { x: 578, y: 238 }, JAW_PIVOT = { x: 634, y: 173 }, POUCH_TOP = 187;
  const KNOT = { x: 553, y: 216 }, TAIL_PIVOT = { x: 446, y: 293 };
  const FISH_FROM = { x: 698, y: 292 }, MOUTH_LOCAL = { x: 715, y: 200 };
  const bez = (a, b, c, d, u) => { const v = 1 - u; return v * v * v * a + 3 * v * v * u * b + 3 * v * u * u * c + u * u * u * d; };
  const dbez = (a, b, c, d, u) => { const v = 1 - u; return 3 * v * v * (b - a) + 6 * v * u * (c - b) + 3 * u * u * (d - c); };

  function update(dt) {
    state.t += dt;
    const target = state.playing ? BASE_V * state.mult : 0;
    state.v += (target - state.v) * Math.min(1, dt * (state.playing ? 1.6 : 1.2));
    if (Math.abs(state.v) < 0.05 && !state.playing) state.v = 0;
    state.s += state.v * dt;

    // 眨眼、偶尔低头看看车筐里的鱼
    if (!reduceMotion) {
      if (state.t > blinkAt) { blinkT = 0; blinkAt = state.t + 2.4 + rand() * 3.6; }
      if (state.t > glanceAt && !feed.active) { glanceT = 0; glanceAt = state.t + 9 + rand() * 7; }
    }
    if (blinkT >= 0) { blinkT += dt; if (blinkT > 0.18) blinkT = -1; }
    if (glanceT >= 0) { glanceT += dt; if (glanceT > 2) glanceT = -1; }
    if (feed.active) { feed.t += dt; if (feed.t > 3.2) feed.active = false; }
  }

  function render() {
    const { s, t, v } = state;
    const sp = clamp(v / BASE_V, 0, 1.4);            // 相对速度
    const spn = Math.min(1, sp);
    const wheelA = s / R;
    const crankA = wheelA / RATIO + CRANK0;

    // 车轮、飞轮、牙盘、链条
    const wd = fx((wheelA * R2D) % 360);
    els.rearSpin.setAttribute('transform', `rotate(${wd})`);
    els.frontSpin.setAttribute('transform', `rotate(${wd})`);
    els.cogSpin.setAttribute('transform', `rotate(${wd})`);
    els.ringSpin.setAttribute('transform', `rotate(${fx((crankA * R2D) % 360)})`);
    els.rollers.setAttribute('stroke-dashoffset', fx(-((crankA * RING.r) / chainLen * 72) % 72));
    const blur = clamp((v - 560) / 420, 0, 1);
    els.blurs.forEach((b) => b.setAttribute('opacity', fx(blur * 0.9)));
    els.spokes.forEach((b) => b.setAttribute('opacity', fx(1 - blur * 0.75)));

    // 身体随踩踏轻微起伏
    const dy = 1.1 * Math.cos(2 * crankA) * spn + 0.35 * Math.sin(t * 2.1);
    const dx = 0.5 * Math.sin(2 * crankA) * spn;
    const torso = `translate(${fx(dx)} ${fx(dy)})`;
    els.pelO.setAttribute('transform', torso);
    els.pelF.setAttribute('transform', torso);

    // 头部：点头 + 张望 + 喂食动作
    let head = 1.6 * Math.sin(2 * crankA - 0.8) * spn;
    if (glanceT >= 0) head += 7 * smooth(0, 0.4, glanceT) * (1 - smooth(1.4, 1.9, glanceT));
    let jawA = 0, pouchExtra = 0;
    if (feed.active) {
      const ft = feed.t;
      head += -20 * (smooth(0, 0.35, ft) - smooth(1.55, 2.0, ft));
      jawA = 24 * (smooth(0, 0.3, ft) - smooth(0.88, 1.0, ft));
      pouchExtra = 0.3 * (smooth(0.9, 1.0, ft) - smooth(1.55, 1.85, ft));
    }
    const headT = `rotate(${fx(head)} ${NECK_PIVOT.x} ${NECK_PIVOT.y})`;
    els.headRot.forEach((g) => g.setAttribute('transform', headT));
    els.jaw.setAttribute('transform', `rotate(${fx(jawA)} ${JAW_PIVOT.x} ${JAW_PIVOT.y})`);

    // 喉囊弹簧抖动
    const k = 140, c = 7;
    pouchSpring.v += (k * (dy - pouchSpring.y) - c * pouchSpring.v) * lastDt;
    pouchSpring.y += pouchSpring.v * lastDt;
    const jig = clamp((pouchSpring.y - dy) * 0.05, -0.08, 0.08);
    const ps = 1 + pouchExtra + jig;
    els.pouch.setAttribute('transform', `translate(0 ${POUCH_TOP}) scale(1 ${fx(ps)}) translate(0 ${-POUCH_TOP})`);
    els.pouchFish.setAttribute('opacity', fx(clamp(pouchExtra / 0.3, 0, 1)));

    // 眨眼
    const bk = blinkT >= 0 ? 1 - 0.92 * Math.sin(Math.PI * blinkT / 0.18) : 1;
    els.eye.setAttribute('transform', `translate(0 150) scale(1 ${fx(bk)}) translate(0 -150)`);

    // 冠羽与尾羽随风抖动
    els.crest.setAttribute('transform', `rotate(${fx(3 + 7 * Math.sin(t * 17) * spn)} 590 152)`);
    const tail = `rotate(${fx(1.8 * Math.sin(t * 13) * spn)} ${TAIL_PIVOT.x} ${TAIL_PIVOT.y})`;
    els.tailRot.forEach((g) => g.setAttribute('transform', tail));

    // 围巾
    const knot = rot({ x: KNOT.x + dx, y: KNOT.y + dy }, head, { x: NECK_PIVOT.x + dx, y: NECK_PIVOT.y + dy });
    els.scarfA.setAttribute('d', ribbon(knot, 72, 12, (100 + 74 * spn) * D2R, 0, t, spn));
    els.scarfB.setAttribute('d', ribbon({ x: knot.x + 1, y: knot.y + 3 }, 58, 10.5, (96 + 88 * spn) * D2R, 1.7, t * 1.13, spn));

    // 翅膀
    skinEls.forEach(([e, f]) => e.setAttribute('d', f(dx, dy)));

    // 腿
    placeLeg(legs.far, { x: HIP_FAR.x + dx, y: HIP_FAR.y + dy }, crankA + Math.PI);
    placeLeg(legs.near, { x: HIP_NEAR.x + dx, y: HIP_NEAR.y + dy }, crankA);

    // 喂鱼：鱼从车筐跳进嘴里、吞咽时脖子鼓包、冒出爱心
    renderFeed(dx, dy, head);

    // 视差背景
    LAYERS.forEach((L) => {
      const o = ((s * L.f + t * L.drift) % L.w + L.w) % L.w;
      L.el.setAttribute('transform', `translate(${fx(-o)} 0)`);
    });
    drawBoardwalk(s);
  }

  function renderFeed(dx, dy, head) {
    if (!feed.active) {
      els.fish.setAttribute('display', 'none'); els.heart.setAttribute('display', 'none'); els.gulp.setAttribute('display', 'none');
      els.lumpO.setAttribute('display', 'none'); els.lumpF.setAttribute('display', 'none');
      return;
    }
    const ft = feed.t;
    // 鱼从车筐里弹起，绕过喉囊前方，落进张开的嘴里
    const u = (ft - 0.15) / 0.75;
    if (u > 0 && u < 1) {
      const pivot = { x: NECK_PIVOT.x + dx, y: NECK_PIVOT.y + dy };
      const m = rot({ x: MOUTH_LOCAL.x + dx, y: MOUTH_LOCAL.y + dy }, -20, pivot);
      const c1 = { x: 792, y: 262 }, c2 = { x: 808, y: 138 };
      const x = bez(FISH_FROM.x, c1.x, c2.x, m.x, u), y = bez(FISH_FROM.y, c1.y, c2.y, m.y, u);
      const vx = dbez(FISH_FROM.x, c1.x, c2.x, m.x, u), vy = dbez(FISH_FROM.y, c1.y, c2.y, m.y, u);
      const wig = 14 * Math.sin(ft * 40);
      els.fish.setAttribute('display', 'inline');
      els.fish.setAttribute('opacity', fx(1 - smooth(0.86, 1, u)));
      els.fish.setAttribute('transform', `translate(${fx(x)} ${fx(y)}) rotate(${fx(Math.atan2(vy, vx) * R2D + 180 + wig)}) scale(${fx(1.15 - 0.25 * smooth(0.8, 1, u))})`);
    } else els.fish.setAttribute('display', 'none');

    const lu = (ft - 1.7) / 0.55;
    if (lu > 0 && lu < 1) {
      const e = smooth(0, 1, lu);
      const p = { x: 603 - 6 * e, y: 196 + 28 * e };
      [els.lumpO, els.lumpF].forEach((l) => { l.setAttribute('display', 'inline'); l.setAttribute('cx', fx(p.x)); l.setAttribute('cy', fx(p.y)); });
    } else { els.lumpO.setAttribute('display', 'none'); els.lumpF.setAttribute('display', 'none'); }

    const gu = (ft - 1.7) / 0.9;
    if (gu > 0 && gu < 1) {
      els.gulp.setAttribute('display', 'inline');
      els.gulp.setAttribute('opacity', fx(smooth(0, 0.15, gu) * (1 - smooth(0.7, 1, gu))));
      els.gulp.setAttribute('transform', `translate(${fx(540 + dx)} ${fx(172 + dy - 10 * gu)}) scale(${fx(0.8 + 0.25 * smooth(0, 0.2, gu))})`);
    } else els.gulp.setAttribute('display', 'none');

    const hu = (ft - 2.2) / 1;
    if (hu > 0 && hu < 1) {
      els.heart.setAttribute('display', 'inline');
      els.heart.setAttribute('opacity', fx(1 - smooth(0.6, 1, hu)));
      const sc = 0.6 + 0.5 * smooth(0, 0.25, hu);
      els.heart.setAttribute('transform', `translate(${fx(632 + dx + 6 * Math.sin(hu * 7))} ${fx(118 + dy - 38 * hu)}) scale(${fx(sc)})`);
    } else els.heart.setAttribute('display', 'none');
  }

  /* ================= 交互 ================= */
  const btnPlay = $('btn-play'), speed = $('speed'), speedOut = $('speed-out');
  function setPlaying(p) {
    state.playing = p;
    $('ico-pause').setAttribute('display', p ? 'inline' : 'none');
    $('ico-play').setAttribute('display', p ? 'none' : 'inline');
    btnPlay.setAttribute('aria-label', p ? '暂停' : '继续');
    btnPlay.title = p ? '暂停（空格）' : '继续（空格）';
    if (reduceMotion) { if (p) svg.unpauseAnimations(); else svg.pauseAnimations(); }
  }
  function setSpeed(m) {
    state.mult = clamp(Math.round(m * 20) / 20, 0.4, 2);
    speed.value = state.mult;
    speedOut.textContent = state.mult.toFixed(1) + '×';
  }
  let actx = null;
  function ding() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const now = actx.currentTime;
      [0, 0.17].forEach((off) => {
        [[2350, 0.16], [3560, 0.07], [6480, 0.03]].forEach(([f, g0]) => {
          const o = actx.createOscillator(), g = actx.createGain();
          o.type = 'sine'; o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, now + off);
          g.gain.exponentialRampToValueAtTime(g0, now + off + 0.006);
          g.gain.exponentialRampToValueAtTime(0.0001, now + off + 0.8);
          o.connect(g); g.connect(actx.destination);
          o.start(now + off); o.stop(now + off + 0.85);
        });
      });
    } catch (e) { /* 无音频也不影响动画 */ }
  }
  function ringBell() {
    const b = els.bell, bu = els.bubble;
    b.classList.remove('ring'); bu.classList.remove('show');
    void b.getBoundingClientRect();
    b.classList.add('ring'); bu.classList.add('show');
    ding();
  }
  const btnTheme = $('btn-theme');
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* 忽略 */ } } };
  const darkMQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    const dusk = theme === 'dusk';
    $('ico-moon').setAttribute('display', dusk ? 'none' : 'inline');
    $('ico-sun').setAttribute('display', dusk ? 'inline' : 'none');
    $('theme-label').textContent = dusk ? '白天' : '黄昏';
    btnTheme.setAttribute('aria-label', dusk ? '切换到白天' : '切换到黄昏');
  }
  function toggleTheme() {
    const next = document.documentElement.getAttribute('data-theme') === 'dusk' ? 'day' : 'dusk';
    applyTheme(next); store.set('pelican-theme', next);
  }
  function feedFish() { if (!feed.active) { feed.active = true; feed.t = 0; glanceT = -1; } }

  btnPlay.addEventListener('click', () => setPlaying(!state.playing));
  speed.addEventListener('input', () => setSpeed(+speed.value));
  $('btn-bell').addEventListener('click', ringBell);
  $('btn-fish').addEventListener('click', feedFish);
  btnTheme.addEventListener('click', toggleTheme);
  if (darkMQ && darkMQ.addEventListener) darkMQ.addEventListener('change', (e) => { if (!store.get('pelican-theme')) applyTheme(e.matches ? 'dusk' : 'day'); });
  $('bell').style.cursor = 'pointer';
  $('bell').addEventListener('click', ringBell);
  $('basket').style.cursor = 'pointer';
  $('basket').addEventListener('click', feedFish);
  window.addEventListener('keydown', (e) => {
    const tag = e.target && e.target.tagName;
    if (tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;   // 让聚焦的按钮自己响应
    if (tag === 'INPUT' && e.key !== ' ') return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === ' ') { e.preventDefault(); setPlaying(!state.playing); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); setSpeed(state.mult + 0.1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); setSpeed(state.mult - 0.1); }
    else if (e.key === 'b' || e.key === 'B') ringBell();
    else if (e.key === 'f' || e.key === 'F') feedFish();
    else if (e.key === 't' || e.key === 'T') toggleTheme();
  });
  window.addEventListener('resize', layout);

  /* ================= 启动 ================= */
  document.documentElement.classList.add('no-anim');
  applyTheme(store.get('pelican-theme') || (darkMQ && darkMQ.matches ? 'dusk' : 'day'));
  buildBike();
  buildDecor();
  layout();
  setPlaying(state.playing);
  setSpeed(1);

  let last = performance.now(), lastDt = 1 / 60;
  function frame(now) {
    lastDt = clamp((now - last) / 1000, 0, 0.05);
    last = now;
    update(lastDt);
    render();
    requestAnimationFrame(frame);
  }
  render();
  requestAnimationFrame(frame);
  requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove('no-anim')));
})();
</script>
</body>
</html>
